[workspace]
resolver = "2"
members = ["crates/core", "crates/platform-win", "crates/app", "crates/winui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"

[workspace.dependencies]
switcheroo-core = { path = "crates/core" }
switcheroo-platform-win = { path = "crates/platform-win" }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
env_logger = "0.11"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true

# 发布用 profile：体积优先（16.9MB → 约 6.3MB）。
# 单独定义是为了不影响 `cargo test --release`（panic=abort 与测试 harness 冲突）。
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# 只给原生浮层这一层按包覆盖：开启体积优先的 "z" 档（比 "s" 更偏向不内联 / 不展开循环），
# egui 版的 dist 配置（上面那段）保持不变。
#
# 这里必须显式写上 `strip = "symbols"`：一旦某个包有了自己的 profile 覆盖，上面
# `[profile.release]` 里的 `strip = true` 就不再作用到这个包的最终链接上，
# 产物会多出约 120 KB 的 COFF 符号表（真机实测 916,720 B → 795,648 B）。
[profile.dist.package.switcheroo-winui]
opt-level = "z"
strip = "symbols"
